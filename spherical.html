<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>الفلك الكروي | Spherical Astronomy</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/page.css">
<style>
#sph{width:100%;aspect-ratio:1/1;max-height:72vh;display:block;background:#050915;border-radius:16px;touch-action:none;cursor:grab}
#kep{width:100%;aspect-ratio:1.5/1;display:block;background:#050915;border-radius:16px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px}
.ctl input[type=range]{width:100%;accent-color:var(--gold)}.ctl output{font-variant-numeric:tabular-nums;color:var(--gold-l);min-width:64px;text-align:end;direction:ltr}
.tri{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}@media(max-width:600px){.tri{grid-template-columns:1fr}}
.kv b{color:var(--muted)}
details.math{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#0b1430}
details.math summary{cursor:pointer;color:var(--gold-l);font-weight:600}
details.math p,details.math li{font-size:13.3px;line-height:1.85}
.eq{direction:ltr;text-align:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:15.5px;margin:7px 0;color:#fff;background:#ffffff08;border-radius:8px;padding:6px;overflow-x:auto}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:9px 12px 9px 12px;padding-inline-start:44px;margin-bottom:7px;border-radius:12px;background:#0b1430;border:1px solid var(--line);font-size:13.5px;line-height:1.75}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:10px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#0a0f1e;font-weight:700;display:grid;place-items:center;font-size:13px}
.steps .eq{font-size:14.5px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.res div{background:#0b1430;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;font-size:12.5px;color:var(--muted)}
.res b{display:block;font-size:19px;color:var(--gold-l);font-variant-numeric:tabular-nums}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inrow .inp{flex:1;min-width:120px}
table.it{border-collapse:collapse;width:100%;font-size:13px;direction:ltr}table.it td,table.it th{padding:5px 8px;border-bottom:1px solid #ffffff12;text-align:center;font-variant-numeric:tabular-nums}table.it th{color:var(--gold-l)}
.note{font-size:12.5px;color:var(--muted);line-height:1.75}
</style>
</head>
<body>
<header class="pg-top">
  <a class="brand" href="index.html"><span id="logo"></span><div><h1 data-i="title"></h1><div class="sub" data-i="sub"></div></div></a>
  <button class="ibtn" id="btnLang">EN</button>
</header>
<main class="wrap">
  <p class="lead" data-h="lead" style="font-size:14.5px;color:#d9e0f2"></p>
  <a href="spherical-course.html" class="panel" style="display:block;text-decoration:none;color:inherit;border-color:var(--gold);margin-bottom:6px"><b style="color:var(--gold-l);font-size:16px" id="crsT"></b><div class="small" id="crsD" style="margin-top:4px;line-height:1.7"></div></a>

  <h2 class="sec" data-i="h1"></h2>
  <p class="lead" data-h="l1"></p>
  <div class="panel">
    <canvas id="sph"></canvas>
    <div class="ctl">
      <span data-i="lat"></span><input type="range" id="sLat" min="-90" max="90" step="0.5" value="30"><output id="oLat"></output>
      <span data-i="dec"></span><input type="range" id="sDec" min="-89" max="89" step="0.5" value="20"><output id="oDec"></output>
      <span data-i="ha"></span><input type="range" id="sHA" min="-180" max="180" step="0.5" value="-50"><output id="oHA"></output>
    </div>
    <div class="inrow" style="margin-top:8px"><button class="btn sm" id="bRun"></button><label class="small" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="cTri" checked><span data-i="showTri"></span></label></div>
    <div class="tri"><div class="kv" id="triSides"></div><div class="kv" id="triAngles"></div></div>
    <p class="note" data-h="sphNote"></p>
    <details class="math"><summary data-i="mathT"></summary><div data-h="m1"></div></details>
  </div>

  <h2 class="sec" data-i="h2"></h2>
  <p class="lead" data-h="l2"></p>
  <div class="panel">
    <div class="inrow">
      <select class="inp" id="selStar"></select>
      <select class="inp" id="selCity"></select>
      <input class="inp" type="date" id="inDate" style="max-width:170px">
    </div>
    <div class="res" id="rsRes"></div>
    <ol class="steps" id="rsSteps" style="margin-top:12px"></ol>
    <p class="note" data-h="rsNote"></p>
  </div>

  <h2 class="sec" data-i="h3"></h2>
  <p class="lead" data-h="l3"></p>
  <div class="panel">
    <canvas id="kep"></canvas>
    <div class="inrow" style="margin-top:8px" id="kPre"></div>
    <div class="ctl">
      <span data-i="ecc"></span><input type="range" id="sE" min="0" max="0.97" step="0.001" value="0.2056"><output id="oE"></output>
      <span data-i="meanAn"></span><input type="range" id="sM" min="0" max="360" step="0.5" value="60"><output id="oM"></output>
    </div>
    <div class="inrow" style="margin-top:8px"><button class="btn sm" id="bKep"></button><label class="small" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="cArea" checked><span data-i="areas"></span></label></div>
    <div class="tri"><div class="kv" id="kKV"></div><div style="overflow-x:auto"><table class="it" id="kIt"></table></div></div>
    <details class="math"><summary data-i="mathT"></summary><div data-h="m3"></div></details>
  </div>

  <h2 class="sec" data-i="hRef"></h2>
  <div class="panel note" id="refs"></div>
  <footer id="foot" style="text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.8"></footer>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);let lang=KH.getLang();const N=(x,d)=>KH.num(x,d,lang);
const D=Math.PI/180,R=180/Math.PI;
const L={ar:{
title:'الفلك الكروي',sub:'المثلث الفلكي، والشروق والعبور والغروب، ومعادلة كبلر',
lead:'نرى النجوم كأنها مثبتة على كرة كبيرة تدور حولنا: «الكرة السماوية». الفلك الكروي هو هندسة هذه الكرة، وبه نحوّل الإحداثيات، ونحسب أوقات الشروق والغروب والعبور، ومواقيت الصلاة، واتجاه القبلة. ثم ننتقل إلى معادلة كبلر التي تحدد موضع الكوكب في مداره في أي لحظة.',
h1:'🌐 الكرة السماوية والمثلث الفلكي PZX',
l1:'اسحب لتدوير الكرة. غيّر خط عرض الراصد φ، وميل النجم δ، وزاويته الساعية H، وشاهد كيف يتغير «المثلث الفلكي» الذي رؤوسه: القطب السماوي P، والسمت (سمت الرأس) Z، والنجم X. كل حسابات الفلك الكروي هي حل لهذا المثلث.',
lat:'خط عرض الراصد φ',dec:'ميل النجم δ',ha:'الزاوية الساعية H',run:'▶ دوران يومي',stop:'⏸ إيقاف',showTri:'إظهار المثلث',
sides:'أضلاع المثلث',angles:'زوايا المثلث',
sPZ:'PZ = 90° − φ (تمام العرض)',sPX:'PX = 90° − δ (تمام الميل)',sZX:'ZX = 90° − h (المسافة السمتية z)',
aP:'الزاوية عند P = H (الزاوية الساعية)',aZ:'الزاوية عند Z = السمت A (أو 360° − A)',aX:'الزاوية عند X = q (الزاوية الاختلافية)',
alt:'الارتفاع h',az:'السمت A (من الشمال)',
sphNote:'الألوان: <span style="color:#7ee2a8">الأفق</span>، <span style="color:#f1d27a">خط الاستواء السماوي</span>، <span style="color:#ff9f5a">المسار اليومي للنجم</span>، <span style="color:#c39bff">خط الزوال</span>. الأجزاء خلف الكرة مرسومة متقطعة. جرّب φ = 90° (القطب: النجوم تدور موازية للأفق) و φ = 0° (الاستواء: كل النجوم تشرق عمودية على الأفق).',
mathT:'📐 التفاصيل الرياضية',
m1:`<p><b>قانون جيب التمام</b> للمثلث الكروي (الضلع ZX مقابل الزاوية H):</p><div class="eq">cos z = cos(90°−φ) cos(90°−δ) + sin(90°−φ) sin(90°−δ) cos H</div><div class="eq">⇒  sin h = sin φ sin δ + cos φ cos δ cos H</div>
<p>وللسمت (مقيسًا من الشمال نحو الشرق):</p><div class="eq">tan A = − sin H / ( tan δ cos φ − sin φ cos H )</div>
<p><b>قانون الجيوب</b>:</p><div class="eq">sin H / sin z = sin A / sin(90°−δ) = sin q / sin(90°−φ)</div>
<p>والزاوية الاختلافية q (مهمة لتوجيه صور الأجرام ولرسم الهلال):</p><div class="eq">tan q = sin H / ( tan φ cos δ − sin δ cos H )</div>
<p>نتائج مباشرة: ارتفاع النجم عند العبور h<sub>max</sub> = 90° − |φ − δ|، والنجم لا يغرب (حول قطبي) إذا كان δ &gt; 90° − φ، ولا يشرق أبدًا إذا كان δ &lt; −(90° − φ). وارتفاع القطب السماوي فوق الأفق يساوي خط العرض φ، وهي الطريقة التي حدد بها الملاحون العرب العرض بقياس ارتفاع الجدي.</p>`,
h2:'⏱️ حساب الشروق والعبور والغروب خطوة بخطوة',
l2:'اختر نجمًا وموقعًا وتاريخًا، وتابع الحساب كما يُكتب في كراسة المحاضرة: كل خطوة بمعادلتها وأرقامها الفعلية.',
star:'النجم',city:'المكان',
rise:'الشروق',transit:'العبور',set:'الغروب',hmax:'أقصى ارتفاع',azR:'سمت الشروق',azS:'سمت الغروب',circ:'لا يغرب (حول قطبي)',never:'لا يشرق من هذا المكان',
rsNote:'نعتبر h₀ = −0°34′ (أثر الانكسار عند الأفق) للنجوم؛ وللشمس h₀ = −0°50′ لإضافة نصف قطرها. الفرق عن الحساب الدقيق في الأطلس (الذي يتتبع الارتفاع عدديًا) أقل من دقيقة واحدة للنجوم.',
steps:{
s1:(p)=>`<b>الإحداثيات لتاريخ الرصد.</b> نجم ${p.name}: α₂₀₀₀ = ${p.a0}، δ₂₀₀₀ = ${p.d0}. بعد تصحيح المبادرة من J2000 إلى تاريخ الرصد (Meeus 21.2): α = ${p.a}، δ = ${p.d}.`,
s2:(p)=>`<b>الزاوية الساعية عند الشروق/الغروب</b> من قانون جيب التمام بوضع h = h₀ = ${p.h0}:<div class="eq">cos H₀ = (sin h₀ − sin φ sin δ) / (cos φ cos δ) = ${p.cosH0}</div>${p.H0txt}`,
s3:(p)=>`<b>الزمن النجمي في غرينتش عند 0ʰ UT</b> لليوم (JD = ${p.jd0}):<div class="eq">θ₀ = 100.46061837° + 36000.770053608° T + … = ${p.th0}</div>`,
s4:(p)=>`<b>لحظة العبور.</b> يعبر النجم خط الزوال عندما يصبح الزمن النجمي المحلي مساويًا لمطلعه المستقيم: θ₀ + 360.985647° m + λ = α، أي:<div class="eq">m₀ = (α − λ − θ₀) / 360.985647° = ${p.m0}  يوم</div>أي ${p.tUT} بالتوقيت العالمي = ${p.tLoc} بالتوقيت المحلي.`,
s5:(p)=>`<b>الشروق والغروب</b> قبل العبور وبعده بمقدار H₀ (محوّلة إلى زمن شمسي بالقسمة على 1.0027379):<div class="eq">m₁ = m₀ − H₀/360.985647° ,  m₂ = m₀ + H₀/360.985647°</div>وإذا خرجت m خارج المدى [0, 1) نضيف أو نطرح يومًا نجميًا (0.99727 يوم شمسي) حتى يقع الحدث في اليوم المطلوب. الشروق ${p.rise}، والغروب ${p.set} (بالتوقيت المحلي).`,
s6:(p)=>`<b>السمت عند الشروق</b> (من الشمال):<div class="eq">cos A = (sin δ − sin φ sin h₀) / (cos φ cos h₀) = ${p.cosA}  ⇒  A = ${p.A}</div>وأقصى ارتفاع عند العبور h<sub>max</sub> = 90° − |φ − δ| = ${p.hmax}.`},
h3:'🪐 معادلة كبلر: أين الكوكب الآن؟',
l3:'الكوكب يتحرك أسرع قرب الحضيض وأبطأ قرب الأوج (قانون كبلر الثاني: مساحات متساوية في أزمنة متساوية). لمعرفة موضعه بعد زمن t نحل معادلة كبلر M = E − e sin E، وهي لا تُحل جبريًا، لذلك نحلّها بالتكرار (طريقة نيوتن). جرّب مذنب هالي!',
ecc:'الاختلاف المركزي e',meanAn:'الشذوذ المتوسط M',kRun:'▶ تحريك الكوكب',kStop:'⏸ إيقاف',areas:'إظهار المساحات المتساوية',
kE:'الشذوذ اللامركزي E',kNu:'الشذوذ الحقيقي ν',kR:'البعد r / a',kV:'السرعة v / v_متوسطة',kIt:'تكرارات نيوتن',
pres:[['عطارد',0.2056],['الأرض',0.0167],['المريخ',0.0934],['مذنب هالي',0.967]],
m3:`<p><b>الشذوذ المتوسط</b> يزداد بانتظام مع الزمن: M = n (t − τ) حيث n = 2π/P و τ لحظة المرور بالحضيض.</p><div class="eq">M = E − e sin E   (معادلة كبلر)</div>
<p>الحل بطريقة نيوتن–رافسون لدالة f(E) = E − e sin E − M:</p><div class="eq">E<sub>k+1</sub> = E<sub>k</sub> − (E<sub>k</sub> − e sin E<sub>k</sub> − M) / (1 − e cos E<sub>k</sub>)</div>
<p>نبدأ بـ E₀ = M (أو E₀ = π عندما e &gt; 0.8 لضمان التقارب). التقارب تربيعي: يتضاعف عدد الأرقام الصحيحة تقريبًا في كل خطوة، كما يظهر في الجدول.</p>
<p>ثم الشذوذ الحقيقي والبعد:</p><div class="eq">tan(ν/2) = √[(1+e)/(1−e)] · tan(E/2) ,   r = a (1 − e cos E)</div>
<p>والسرعة من معادلة الحيوية (vis-viva): v² = GM (2/r − 1/a)، فنسبة سرعة الحضيض إلى الأوج = (1+e)/(1−e)، وهي لمذنب هالي ≈ 60.</p>`,
hRef:'📚 المراجع'
},en:{
title:'Spherical Astronomy',sub:'The PZX triangle, rise–transit–set, and Kepler’s equation',
lead:'We see the stars as if fixed on a huge sphere turning around us: the celestial sphere. Spherical astronomy is the geometry of that sphere — how we convert coordinates and compute rising, transit and setting times, prayer times and the Qibla. Then we move to Kepler’s equation, which gives a planet’s position in its orbit at any moment.',
h1:'🌐 The celestial sphere and the PZX triangle',
l1:'Drag to rotate the sphere. Change the observer’s latitude φ, the star’s declination δ and hour angle H, and watch the astronomical triangle whose vertices are the celestial pole P, the zenith Z and the star X. Every spherical-astronomy calculation is a solution of this triangle.',
lat:'Observer latitude φ',dec:'Star declination δ',ha:'Hour angle H',run:'▶ Diurnal motion',stop:'⏸ Stop',showTri:'Show triangle',
sides:'Sides',angles:'Angles',
sPZ:'PZ = 90° − φ (co-latitude)',sPX:'PX = 90° − δ (co-declination)',sZX:'ZX = 90° − h (zenith distance z)',
aP:'Angle at P = H (hour angle)',aZ:'Angle at Z = azimuth A (or 360° − A)',aX:'Angle at X = q (parallactic angle)',
alt:'Altitude h',az:'Azimuth A (from north)',
sphNote:'Colours: <span style="color:#7ee2a8">horizon</span>, <span style="color:#f1d27a">celestial equator</span>, <span style="color:#ff9f5a">the star’s diurnal circle</span>, <span style="color:#c39bff">meridian</span>. Parts behind the sphere are dashed. Try φ = 90° (pole: stars circle parallel to the horizon) and φ = 0° (equator: every star rises perpendicular to the horizon).',
mathT:'📐 Mathematical details',
m1:`<p>The spherical <b>cosine rule</b> (side ZX opposite angle H):</p><div class="eq">cos z = cos(90°−φ) cos(90°−δ) + sin(90°−φ) sin(90°−δ) cos H</div><div class="eq">⇒  sin h = sin φ sin δ + cos φ cos δ cos H</div><p>Azimuth (from north through east):</p><div class="eq">tan A = − sin H / ( tan δ cos φ − sin φ cos H )</div><p>The <b>sine rule</b>:</p><div class="eq">sin H / sin z = sin A / sin(90°−δ) = sin q / sin(90°−φ)</div><p>The parallactic angle q (needed to orient images and to draw the crescent):</p><div class="eq">tan q = sin H / ( tan φ cos δ − sin δ cos H )</div><p>Direct consequences: transit altitude h<sub>max</sub> = 90° − |φ − δ|; a star is circumpolar if δ &gt; 90° − φ and never rises if δ &lt; −(90° − φ); the pole’s altitude equals the latitude — how Arab navigators found latitude from the altitude of Polaris.</p>`,
h2:'⏱️ Rise, transit and set — step by step',
l2:'Pick a star, place and date, and follow the computation as you would write it in lecture notes: every step with its formula and the actual numbers.',
star:'Star',city:'Place',
rise:'Rise',transit:'Transit',set:'Set',hmax:'Max altitude',azR:'Rising azimuth',azS:'Setting azimuth',circ:'Never sets (circumpolar)',never:'Never rises here',
rsNote:'We use h₀ = −0°34′ (horizon refraction) for stars; for the Sun h₀ = −0°50′ adds its semi-diameter. The difference from the exact numerical tracking in the Atlas is under one minute for stars.',
steps:{
s1:(p)=>`<b>Coordinates of date.</b> ${p.name}: α₂₀₀₀ = ${p.a0}, δ₂₀₀₀ = ${p.d0}. After precession from J2000 to the date (Meeus 21.2): α = ${p.a}, δ = ${p.d}.`,
s2:(p)=>`<b>Hour angle at rising/setting</b> from the cosine rule with h = h₀ = ${p.h0}:<div class="eq">cos H₀ = (sin h₀ − sin φ sin δ) / (cos φ cos δ) = ${p.cosH0}</div>${p.H0txt}`,
s3:(p)=>`<b>Greenwich sidereal time at 0ʰ UT</b> of the day (JD = ${p.jd0}):<div class="eq">θ₀ = 100.46061837° + 36000.770053608° T + … = ${p.th0}</div>`,
s4:(p)=>`<b>Transit.</b> The star crosses the meridian when local sidereal time equals its right ascension: θ₀ + 360.985647° m + λ = α, so<div class="eq">m₀ = (α − λ − θ₀) / 360.985647° = ${p.m0}  day</div>i.e. ${p.tUT} UT = ${p.tLoc} local time.`,
s5:(p)=>`<b>Rise and set</b> are H₀ before and after transit (converted to solar time by dividing by 1.0027379):<div class="eq">m₁ = m₀ − H₀/360.985647° ,  m₂ = m₀ + H₀/360.985647°</div>If m falls outside [0, 1) we add or subtract one sidereal day (0.99727 solar day) so the event lies on the chosen date. Rise ${p.rise}, set ${p.set} (local time).`,
s6:(p)=>`<b>Rising azimuth</b> (from north):<div class="eq">cos A = (sin δ − sin φ sin h₀) / (cos φ cos h₀) = ${p.cosA}  ⇒  A = ${p.A}</div>Transit altitude h<sub>max</sub> = 90° − |φ − δ| = ${p.hmax}.`},
h3:'🪐 Kepler’s equation: where is the planet now?',
l3:'A planet moves faster near perihelion and slower near aphelion (Kepler’s second law: equal areas in equal times). To find its position after time t we solve Kepler’s equation M = E − e sin E, which has no algebraic solution, so we iterate (Newton’s method). Try Halley’s comet!',
ecc:'Eccentricity e',meanAn:'Mean anomaly M',kRun:'▶ Move the planet',kStop:'⏸ Stop',areas:'Show equal areas',
kE:'Eccentric anomaly E',kNu:'True anomaly ν',kR:'Distance r / a',kV:'Speed v / v_mean',kIt:'Newton iterations',

$('bKep').onclick=()=>{kRun=!kRun;$('bKep').textContent=kRun?t('kStop'):t('kRun');};
['selStar','selCity','inDate'].forEach(id=>$(id).onchange=computeRS);
$('btnLang').onclick=()=>{lang=lang==='ar'?'en':'ar';KH.setLang(lang);page();};
addEventListener('resize',()=>{drawSphere();drawKepler();});
page();requestAnimationFrame(loop);
window.__sph={computeRS,solveKepler};
})();
</script>
</body>
