<style>
.hero{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media(max-width:620px){.hero{grid-template-columns:1fr;text-align:center}}
.sunball{width:180px;height:180px;border-radius:50%;margin:auto;background:radial-gradient(circle at 45% 40%,#fff6c8 0,#ffd36b 35%,#ff9a2a 70%,#c2410c 100%);box-shadow:0 0 60px 18px #ff9a2a66,0 0 140px 40px #ff6a0033;cursor:pointer;position:relative;overflow:hidden}
.sunball img{width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:.9;mix-blend-mode:screen}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.fact{padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#0e1630aa;font-size:12.5px}.fact b{display:block;color:var(--gold-l);font-size:15px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.live-grid figure{margin:0;text-align:center}.live-grid img{width:100%;aspect-ratio:1;border-radius:12px;background:#000;object-fit:cover;border:1px solid var(--line)}
.live-grid figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.layers{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
@media(max-width:700px){.layers{grid-template-columns:1fr}}
.lay-info h3{margin:0 0 6px;color:var(--gold-l)}
.phen{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.phen .panel h3{margin:0 0 6px;font-size:16px;color:#fff}.phen .panel p{margin:0;font-size:13.3px;line-height:1.75;color:#d5ddf1}
.eq{direction:ltr;text-align:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:15px;margin:8px 0;color:#fff;background:#0b1229;border-radius:10px;padding:8px}
canvas.plot{width:100%;height:260px;display:block;background:#070b18;border-radius:12px}
.rng{width:100%;accent-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.vid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vid video{width:100%;border-radius:12px;background:#000}
.small{font-size:12px;color:var(--muted)}
.chain{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chain .st{flex:0 0 auto;min-width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0e1630;font-size:12.5px;text-align:center;cursor:pointer}
.chain .st.on{border-color:var(--gold);background:#2a2412}
.chain .st b{display:block;color:var(--gold-l);font-size:13.5px;margin-bottom:3px}
</style>
</head>

hLive:'🛰️ الشمس الآن (صور حية من SDO وSOHO)',liveLead:'أحدث صور مرصد ديناميكا الشمس SDO بأطوال موجية مختلفة، يُظهر كل طول موجي طبقة ذات درجة حرارة معينة، وصور كوروناغراف LASCO للانبعاثات الكتلية.',

facts:[['1.39 million km','Diameter (109 × Earth)'],['1.989×10³⁰ kg','Mass'],['5772 K','Surface temperature'],['15.7 million K','Core temperature'],['3.828×10²⁶ W','Luminosity'],['8 min 20 s','Light travel time'],['25 / 35 days','Rotation: equator / poles'],['4.6 billion yr','Age']],

// ---------- layers ----------
const LAY=[
 {k:'core',r:0.25,c:'#fff3b0',ar:['القلب','٠ – ٠٫٢٥ R☉','١٥٫٧ مليون كلفن، كثافة ١٥٠ جم/سم³ (١٥٠ مرة كثافة الماء). هنا يحدث الاندماج النووي عبر سلسلة بروتون–بروتون: 4¹H → ⁴He + 2e⁺ + 2ν + ٢٦٫٧ م.إ.ف. ويتحول نحو ٤ ملايين طن من الكتلة إلى طاقة كل ثانية (E = mc²).'],en:['Core','0 – 0.25 R☉','15.7 MK, density 150 g/cm³. Fusion by the proton–proton chain: 4¹H → ⁴He + 2e⁺ + 2ν + 26.7 MeV. About 4 million tonnes of mass become energy every second (E = mc²).']},
 {k:'rad',r:0.70,c:'#ffd166',ar:['منطقة الإشعاع','٠٫٢٥ – ٠٫٧ R☉','من ٧ إلى ٢ مليون كلفن. تنتقل الطاقة فوتوناتٍ تتشتت ملايين المرات (سير عشوائي)، فيستغرق عبور هذه المنطقة من عشرات الآلاف إلى مئات الآلاف من السنين.'],en:['Radiative zone','0.25 – 0.7 R☉','7 → 2 MK. Energy moves as photons scattered millions of times (a random walk), taking tens to hundreds of thousands of years to cross.']},
 {k:'tach',r:0.72,c:'#ff6b4a',ar:['الطبقة الانتقالية (Tachocline)','≈ ٠٫٧ R☉','طبقة رقيقة بين منطقة الإشعاع التي تدور كجسم صلب ومنطقة الحمل ذات الدوران التفاضلي. يضخّم القص هنا المجال المغناطيسي، وهذا أساس الدينامو الشمسي والدورة ذات الأحد عشر عامًا.'],en:['Tachocline','≈ 0.7 R☉','A thin shear layer between the rigidly rotating radiative zone and the differentially rotating convection zone. The shear amplifies the magnetic field: the heart of the solar dynamo and the 11-year cycle.']},
 {k:'conv',r:0.96,c:'#ff9a2a',ar:['منطقة الحمل','٠٫٧ – ١ R☉','من ٢ مليون إلى ٥٨٠٠ كلفن. تصعد البلازما الساخنة ثم تبرد وتهبط كالماء المغلي، وتظهر على السطح حبيباتٍ (granules) قطر الواحدة نحو ١٠٠٠ كم وعمرها ٨–٢٠ دقيقة.'],en:['Convection zone','0.7 – 1 R☉','2 MK → 5800 K. Hot plasma rises, cools and sinks like boiling water; at the surface it shows as ~1000 km granules lasting 8–20 minutes.']},
 {k:'photo',r:1.0,c:'#ffb648',ar:['الفوتوسفير (السطح المرئي)','سُمك ≈ ٥٠٠ كم','٥٧٧٢ كلفن، ومنه يصدر الضوء الذي نراه. تظهر عليه البقع الشمسية (أبرد، نحو ٣٨٠٠ ك، ومجالها المغناطيسي قوي جدًا ~٣٠٠٠ جاوس) والصِّيَخ (faculae) والحبيبات، ويظهر فيه إظلام الحافة.'],en:['Photosphere','≈ 500 km thick','5772 K: the visible surface. Sunspots (cooler, ~3800 K, ~3000 G fields), faculae, granulation and limb darkening.']},
 {k:'chromo',r:1.035,c:'#ff4d6d',ar:['الكروموسفير','≈ ٢٠٠٠ كم','من ٤٠٠٠ إلى ٢٥٠٠٠ كلفن. لونها أحمر وردي (خط Hα)، وتظهر لحظات في الكسوف الكلي، وفيها الأشواك (spicules) والخيوط والشُّواظ.'],en:['Chromosphere','≈ 2000 km','4000 → 25,000 K. Pinkish-red (Hα), briefly visible at total eclipse. Spicules, filaments and prominences.']},
 {k:'tr',r:1.05,c:'#c77dff',ar:['منطقة التحول','بضع مئات من الكيلومترات','تقفز الحرارة من ٢٥ ألف إلى مليون كلفن عبر مسافة صغيرة جدًا، ونرصدها بالأشعة فوق البنفسجية (AIA 304 وIRIS).'],en:['Transition region','a few hundred km','Temperature jumps from 25,000 K to 1 MK over a tiny distance; observed in UV (AIA 304, IRIS).']},
 {k:'corona',r:1.75,c:'#6fa8ff',ar:['الإكليل (الكورونا)','حتى ملايين الكيلومترات','من ١ إلى ٣ ملايين كلفن، أي أسخن من السطح نحو ٢٠٠ مرة، وهذه «مسألة تسخين الإكليل»، ومن تفسيراتها المرشحة موجات ألفين والتوهجات النانوية (إعادة الاتصال المغناطيسي). يُرى في الكسوف الكلي وبالكوروناغراف والأشعة فوق البنفسجية القصوى، ومنه تنطلق الرياح الشمسية.'],en:['Corona','out to millions of km','1–3 MK, ~200× hotter than the surface: the coronal heating problem (Alfvén waves, nanoflares/reconnection). Seen at total eclipse, with coronagraphs and in EUV; the source of the solar wind.']}];

 const svg=$('layersSvg'),cx=255,cy=185,R=120;svg.setAttribute('viewBox','0 0 420 370');svg.style.direction='ltr';

 let h='<defs><radialGradient id="cg"><stop offset=".6" stop-color="#6fa8ff40"/><stop offset="1" stop-color="#6fa8ff00"/></radialGradient><radialGradient id="pg"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".75" stop-color="#ffb648"/><stop offset="1" stop-color="#e0761c"/></radialGradient></defs>';
 h+=`<circle cx="${cx}" cy="${cy}" r="${R*1.5}" fill="url(#cg)" data-k="corona" style="cursor:pointer" stroke="${sel==='corona'?'#fff':'none'}"/>`;
 h+=`<circle cx="${cx}" cy="${cy}" r="${R*1.04}" fill="${ch.c}" opacity=".9" data-k="chromo" style="cursor:pointer" stroke="${sel==='chromo'?'#fff':'none'}" stroke-width="2"/>`;
 h+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#pg)" data-k="photo" style="cursor:pointer" stroke="${sel==='photo'?'#fff':'none'}" stroke-width="2"/>`;
 // cut-away quadrant (top-left) showing the interior, outer to inner

function setupCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function logPlot(cv,series,opt){const [g,W,H]=setupCanvas(cv);const l=46,r=12,tp=14,b=26,x0=opt.x0,x1=opt.x1,y0=opt.y0,y1=opt.y1;
 const X=x=>l+(x-x0)/(x1-x0)*(W-l-r),Y=y=>tp+(1-(Math.log10(y)-y0)/(y1-y0))*(H-tp-b);
 g.fillStyle='#070b18';g.fillRect(0,0,W,H);g.font='11px sans-serif';g.textAlign='right';g.textBaseline='middle';
 const cls=['A','B','C','M','X'];for(let e=y0;e<=y1;e++){const y=Y(10**e);g.strokeStyle='#ffffff18';g.beginPath();g.moveTo(l,y);g.lineTo(W-r,y);g.stroke();g.fillStyle='#9fb0d6';g.fillText('10'+sup(e),l-4,y);const ci=e+8;if(ci>=0&&ci<5&&e<y1){g.fillStyle='#f1d27a';g.textAlign='left';g.fillText(cls[ci],W-r-10,(y+Y(10**(e+1)))/2);g.textAlign='right';}}
 g.textAlign='center';g.textBaseline='top';for(const tk of opt.ticks){g.fillStyle='#9fb0d6';g.fillText(tk[1],X(tk[0]),H-b+6);}
 for(const s of series){g.strokeStyle=s.c;g.lineWidth=1.6;g.beginPath();s.x.forEach((x,i)=>{const v=s.y[i];if(!(v>0))return;const px=X(x),py=Y(Math.max(v,10**y0));i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();}
 if(opt.mark){g.strokeStyle='#ffffff99';g.setLineDash([3,3]);g.beginPath();g.moveTo(X(opt.mark[0]),tp);g.lineTo(X(opt.mark[0]),H-b);g.stroke();g.setLineDash([]);g.fillStyle='#fff';g.textAlign='center';g.fillText(opt.mark[1],X(opt.mark[0]),tp);}
 if(opt.legend){g.textAlign='left';opt.legend.forEach((L,i)=>{g.fillStyle=L[1];g.fillText(L[0],l+8,tp+4+i*14);});}
 return {X,Y,g};}
function sup(e){const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};return String(e).split('').map(c=>m[c]).join('');}
function renderGoes(){const G=window.GOES_20110607,mn=G.min.filter(m=>m>=300&&m<=600),i0=G.min.indexOf(mn[0]),i1=G.min.indexOf(mn[mn.length-1]);
 logPlot($('goesPlot'),[{x:mn,y:G.long.slice(i0,i1+1),c:'#ff8a3d'},{x:mn,y:G.short.slice(i0,i1+1),c:'#6fa8ff'}],{x0:300,x1:600,y0:-8,y1:-3,ticks:[[300,'05:00'],[360,'06:00'],[420,'07:00'],[480,'08:00'],[540,'09:00'],[600,'10:00 UT']],mark:[399,'M2.5'],legend:[['1–8 Å','#ff8a3d'],['0.5–4 Å','#6fa8ff']]});
 $('goesCap').textContent=t('goesCap');}
function flareClass(f){const L=['A','B','C','M','X'],e=Math.floor(Math.log10(f));const ci=Math.min(4,Math.max(0,e+8));const base=10**(ci-8);return L[ci]+(f/base).toFixed(1);}
function renderFlx(){const f=10**+$('flx').value;const cl=flareClass(f);const eff={A:['خلفية هادئة','Quiet background'],B:['نشاط ضعيف','Weak activity'],C:['صغير، بلا أثر يُذكر','Small, little effect'],M:['متوسط: انقطاع راديو بسيط عند القطبين (R1–R2)','Medium: minor polar radio blackouts (R1–R2)'],X:['قوي: انقطاع راديو واسع على الجانب المضاء (R3–R5)','Strong: wide HF blackouts on the dayside (R3–R5)']}[cl[0]];

 g.fillStyle='#070b18';g.fillRect(0,0,W,H);g.font='10px sans-serif';g.fillStyle='#9fb0d6';g.textAlign='center';for(let y=1750;y<=2025;y+=25)g.fillText(y,X(y),H-8);
 g.strokeStyle='#6fa8ff88';g.lineWidth=1;g.beginPath();xs.forEach((x,i)=>i?g.lineTo(X(x),Y(ys[i])):g.moveTo(X(x),Y(ys[i])));g.stroke();
 g.strokeStyle='#f1d27a';g.lineWidth=2;g.beginPath();let st=false;xs.forEach((x,i)=>{if(sm[i]>0){st?g.lineTo(X(x),Y(sm[i])):g.moveTo(X(x),Y(sm[i]));st=true;}});g.stroke();

function dbm(){const v0=+$('v0').value,w=+$('w').value,gm=+$('gm').value*1e-7,Rs=695700,r0=20*Rs,AU=1.495978707e8;

 const dv=v0-w,s=Math.sign(dv)||1;const r=tt=>s/gm*Math.log(1+s*gm*dv*tt)+w*tt+r0,v=tt=>dv/(1+s*gm*dv*tt)+w;
 let lo=0,hi=20*86400;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(r(m)<AU)lo=m;else hi=m;}const ta=(lo+hi)/2;
 $('dbmOut').innerHTML=`${t('arr')}: <b style="color:var(--gold-l);font-size:20px">${(ta/3600).toFixed(1)} ${t('h')}</b> (${(ta/86400).toFixed(2)} d)<br>${t('varr')}: <b>${v(ta).toFixed(0)} km/s</b>`;
 const [g,W,H]=setupCanvas($('dbmPlot')),l=40,rr=10,tp=10,b=22,X=x=>l+x/ta*(W-l-rr)*0.92,vmax=Math.max(v0,w)*1.1,Y=y=>tp+(1-y/vmax)*(H-tp-b);
 g.fillStyle='#070b18';g.fillRect(0,0,W,H);g.font='10px sans-serif';g.fillStyle='#9fb0d6';g.textAlign='right';for(let y=0;y<=vmax;y+=500){g.fillText(y,l-4,Y(y)+3);g.strokeStyle='#ffffff12';g.beginPath();g.moveTo(l,Y(y));g.lineTo(W-rr,Y(y));g.stroke();}
 g.strokeStyle='#6fa8ff';g.setLineDash([4,4]);g.beginPath();g.moveTo(l,Y(w));g.lineTo(W-rr,Y(w));g.stroke();g.setLineDash([]);
 g.strokeStyle='#ff8a3d';g.lineWidth=2;g.beginPath();for(let i=0;i<=100;i++){const tt=ta*i/100;i?g.lineTo(X(tt),Y(v(tt))):g.moveTo(X(tt),Y(v(tt)));}g.stroke();
 g.fillStyle='#f1d27a';g.textAlign='center';g.fillText('1 AU',X(ta),tp+8);g.fillStyle='#9fb0d6';g.fillText('v (km/s) vs t',W/2,H-6);}

function renderLocal(){const o=new AE.Observer(loc.lat,loc.lon,0),now=new Date(),y=now.getUTCFullYear();
 const days=[[now,'#f1d27a',lang==='ar'?'اليوم':'Today'],[new Date(Date.UTC(y,5,21)),'#ff8a3d',lang==='ar'?'الانقلاب الصيفي':'June solstice'],[new Date(Date.UTC(y,11,21)),'#6fa8ff',lang==='ar'?'الانقلاب الشتوي':'December solstice']];
 const [g,W,H]=setupCanvas($('pathPlot')),l=30,rr=10,tp=14,b=24,X=a=>l+(a-0)/360*(W-l-rr),Y=h=>tp+(1-h/90)*(H-tp-b);
 g.fillStyle='#070b18';g.fillRect(0,0,W,H);g.font='10px sans-serif';g.fillStyle='#9fb0d6';g.textAlign='center';const dn=lang==='ar'?['ش','ق','ج','غ','ش']:['N','E','S','W','N'];for(let a=0;a<=360;a+=90)g.fillText(dn[a/90],X(a),H-8);g.textAlign='right';for(let h=0;h<=90;h+=30)g.fillText(h+'°',l-3,Y(h)+3);
 g.strokeStyle='#ffffff30';g.beginPath();g.moveTo(l,Y(0));g.lineTo(W-rr,Y(0));g.stroke();
 days.forEach(([d,c,n],k)=>{const ds=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-loc.lon/15*3600000;g.strokeStyle=c;g.lineWidth=2;g.beginPath();let st=false;for(let m=0;m<=1440;m+=6){const tt=new Date(ds+m*60000),eq=AE.Equator(AE.Body.Sun,tt,o,true,true),hz=AE.Horizon(tt,o,eq.ra,eq.dec,'normal');if(hz.altitude>0){st?g.lineTo(X(hz.azimuth),Y(hz.altitude)):g.moveTo(X(hz.azimuth),Y(hz.altitude));st=true;}else st=false;}g.stroke();g.fillStyle=c;g.textAlign='left';g.fillText(n,l+6,tp+4+k*13);});
 // equation of time
 const [g2,W2,H2]=setupCanvas($('eotPlot')),pts=[];for(let dd=0;dd<366;dd+=2){const d0=new Date(Date.UTC(y,0,1+dd,12,0)-loc.lon/15*3600000);const hn=AE.SearchHourAngle(AE.Body.Sun,o,0,new Date(d0.getTime()-6*3600000));pts.push([dd,(d0-hn.time.date)/60000]);}
 const X2=x=>30+x/366*(W2-40),Y2=v=>14+(1-(v+18)/36)*(H2-38);g2.fillStyle='#070b18';g2.fillRect(0,0,W2,H2);g2.font='10px sans-serif';g2.fillStyle='#9fb0d6';g2.textAlign='right';for(let v=-15;v<=15;v+=5){g2.fillText(v,26,Y2(v)+3);g2.strokeStyle=v?'#ffffff12':'#ffffff40';g2.beginPath();g2.moveTo(30,Y2(v));g2.lineTo(W2-10,Y2(v));g2.stroke();}
 g2.textAlign='center';const mo=lang==='ar'?['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس']:['J','F','M','A','M','J','J','A','S','O','N','D'];mo.forEach((m,i)=>g2.fillText(m,X2(i*30.4+15),H2-8));
 g2.strokeStyle='#f1d27a';g2.lineWidth=2;g2.beginPath();pts.forEach((p,i)=>i?g2.lineTo(X2(p[0]),Y2(p[1])):g2.moveTo(X2(p[0]),Y2(p[1])));g2.stroke();g2.fillStyle='#f1d27a';g2.textAlign='left';g2.fillText(lang==='ar'?'معادلة الزمن (دقائق)':'Equation of time (min)',36,20);
 const mx=pts.reduce((a,b)=>b[1]>a[1]?b:a),mn=pts.reduce((a,b)=>b[1]<a[1]?b:a);
 $('localNote').textContent=lang==='ar'?`تبلغ معادلة الزمن أقصى قيمة لها +${mx[1].toFixed(1)} دقيقة (أوائل نوفمبر، حين تسبق الشمس الساعة) وأدنى قيمة ${mn[1].toFixed(1)} دقيقة (فبراير). والسبب إهليلجية مدار الأرض (قانون كبلر الثاني) وميل محورها ٢٣٫٤٤°، وهما أيضًا سبب شكل الأنالِما ∞.`:`The equation of time peaks at +${mx[1].toFixed(1)} min (early November, Sun ahead of the clock) and bottoms at ${mn[1].toFixed(1)} min (February), caused by Earth's orbital eccentricity (Kepler's 2nd law) and its 23.44° tilt; the same causes make the ∞-shaped analemma.`;}

const VIDS=[['media/sdo_x9_flare_2024-10-03.mp4','https://svs.gsfc.nasa.gov/14701/','توهج X9.0 – ٣ أكتوبر ٢٠٢٤ (أقوى توهج في الدورة ٢٥)','X9.0 flare – 3 Oct 2024 (strongest of Cycle 25)','img/sdo_aia193_2013-06-24.jpg'],['media/sdo_x18_flare_2024-10-26.mp4','https://svs.gsfc.nasa.gov/14710/','توهج X1.8 – ٢٦ أكتوبر ٢٠٢٤ بثلاثة أطوال موجية','X1.8 flare – 26 Oct 2024 in three wavelengths','img/solo_eui174_2022-04-01.jpg'],['media/sdo_x33_flare_2024-10-23.mp4','https://svs.gsfc.nasa.gov/14709/','توهج X3.3 – ٢٣ أكتوبر ٢٠٢٤ (4K)','X3.3 flare – 23 Oct 2024 (4K)','img/sdo_hmi_continuum_2023-01-31.jpg']];
