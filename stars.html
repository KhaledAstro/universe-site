<style>
#hr{width:100%;aspect-ratio:1/1.3;max-height:82vh;display:block;background:#050915;border-radius:16px;touch-action:none}@media(min-width:900px){#hr{aspect-ratio:1.25/1}}
.mrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.mrow::-webkit-scrollbar{display:none}
.ctl{display:flex;gap:8px;align-items:center;margin-top:10px}.ctl input[type=range]{flex:1;accent-color:var(--gold)}
.starbox{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}@media(max-width:520px){.starbox{grid-template-columns:110px 1fr}}
#disc{width:150px;height:150px}@media(max-width:520px){#disc{width:110px;height:110px}}
.stage{font-size:17px;color:var(--gold-l);font-weight:700;margin-bottom:4px}
.desc{font-size:13.5px;line-height:1.8;color:#d9e0f2;margin-top:8px}
#tl{width:100%;height:46px;display:block;margin-top:10px}
details.math{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#0b1430}
details.math summary{cursor:pointer;color:var(--gold-l);font-weight:600}
details.math p{font-size:13.3px;line-height:1.85}
.eq{direction:ltr;text-align:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:16px;margin:8px 0;color:#fff;background:#ffffff08;border-radius:8px;padding:6px}
table.t2{border-collapse:collapse;width:100%;font-size:13px}table.t2 td,table.t2 th{padding:7px 6px;border-bottom:1px solid #ffffff12;text-align:start;vertical-align:top}table.t2 th{color:var(--gold-l)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.imgs a{display:block;padding:12px;border-radius:14px;background:#0b1430;border:1px solid var(--line);color:inherit;text-decoration:none;font-size:13px;line-height:1.7}
.imgs a b{color:var(--gold-l);display:block;font-size:14.5px}
.note{font-size:12.5px;color:var(--muted);line-height:1.75}
/* here is the modification of stage photo + image cards */
.stfig{margin:12px auto 0;max-width:560px;border-radius:14px;overflow:hidden;background:#060b1c;border:1px solid var(--line)}
.ph{display:block}.stfig .ph{position:relative;aspect-ratio:16/9;background:#050915}
.stfig img,.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:13px;color:#b9c6e6;background:radial-gradient(circle at 50% 40%,#1a2550,#050915)}
.ph.err img{display:none}.ph.err .fb{display:flex}
.stfig figcaption{padding:9px 12px;font-size:12.5px;line-height:1.7;color:#d9e0f2}.stfig figcaption i{color:var(--muted);font-style:normal;display:block;font-size:11.5px}
.imgs a{padding:0;overflow:hidden}.imgs a .ph{display:block;position:relative;aspect-ratio:4/3;background:#050915}.imgs a .tx{display:block;padding:10px 12px}
.disccap{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);let lang=KH.getLang();const N=(x,d)=>KH.num(x,d,lang);
const L={ar:{
title:'حياة النجوم',sub:'من السحابة إلى القزم الأبيض أو الثقب الأسود',
lead:'كتلة النجم عند ولادته تحدد تقريبًا كل شيء في حياته: لونه، وسطوعه، وطول عمره، وطريقة موته. النجوم الأثقل تحرق وقودها أسرع بكثير، فتعيش ملايين السنين فقط وتنتهي بانفجار عظيم، بينما تعيش النجوم الخفيفة مليارات السنين وتنطفئ بهدوء.',
h1:'⭐ مخطط هرتزشبرونغ–راسل (HR) المتحرك',
l1:'اختر الكتلة الابتدائية، ثم شغّل الحركة أو اسحب المؤشر. النقطة الذهبية هي النجم على مخطط HR (السطوع مقابل درجة حرارة السطح)، والمسار محسوب بنماذج تطور نجمي منشورة، لا مرسوم باليد.',
play:'▶ تشغيل',pause:'⏸ إيقاف',sun:'☀️ مستقبل الشمس',
tlNote:'الشريط الزمني أعلاه بمقياس زمني حقيقي: لاحظ أن «التسلسل الرئيسي» يستغرق نحو ٩٠٪ من عمر النجم، بينما المراحل الأخيرة قصيرة جدًا. أما مؤشر التمرير فيتحرك على طول المسار لا بانتظام في الزمن، حتى تظهر المراحل القصيرة بوضوح. الخط المتقطع من قمة فرع العمالقة المقارب إلى القزم الأبيض يمثّل مرحلة السديم الكوكبي، وهي سريعة (~١٠⁴ سنة) ولا يتتبعها النموذج بالتفصيل.',
age:'العمر',mass:'الكتلة الحالية',lum:'السطوع',teff:'حرارة السطح',rad:'نصف القطر',myr:'مليون سنة',gyr:'مليار سنة',
axX:'درجة حرارة السطح (كلفن) ←',axY:'السطوع (بالنسبة للشمس)',
regions:{ms:'التسلسل الرئيسي',giants:'العمالقة',sg:'العمالقة العظام',wd:'الأقزام البيض'},
mathT:'📐 التفاصيل الرياضية',
m1:`<p><b>قانون ستيفان–بولتزمان</b> يربط محوري المخطط بنصف القطر (ولذلك الخطوط المائلة الرمادية خطوط نصف قطر ثابت):</p><div class="eq">L = 4π R² σ T<sub>eff</sub>⁴   ⇒   log L = 2 log R + 4 log T<sub>eff</sub> + const</div>
<p><b>علاقة الكتلة–السطوع</b> على التسلسل الرئيسي تقريبًا L ∝ M<sup>3.5</sup> (للنجوم 1–10 M☉)، والوقود المتاح ∝ M، لذا:</p><div class="eq">t<sub>MS</sub> ≈ 10¹⁰ سنة × (M/M☉)<sup>−2.5</sup></div>
<p>مثلًا نجم 10 M☉ يعيش ≈ 3×10⁷ سنة فقط. النموذج المستخدم هنا أدق من هذا التقريب: 1 M☉ ← 11.0 مليار سنة، 5 M☉ ← 104 مليون، 20 M☉ ← 8.8 مليون.</p>
<p><b>حد تشاندراسيخار</b>: لا يستطيع ضغط الإلكترونات المنحلّة أن يحمل قزمًا أبيض أثقل من ≈ 1.4 M☉، وهذا يحدد مصير النوى الثقيلة:</p><div class="eq">M<sub>Ch</sub> ≈ 5.83 / μ<sub>e</sub>² M☉ ≈ 1.46 M☉   (μ<sub>e</sub> = 2)</div>
<p><b>علاقة نصف القطر–الكتلة للأقزام البيض</b>: R ∝ M<sup>−1/3</sup>، فالقزم الأثقل أصغر حجمًا! (قارن قزمي 1 M☉ و 8 M☉ في النموذج.)</p>
<p><b>حد إدنغتون</b> للسطوع الأقصى قبل أن يدفع الإشعاع طبقات النجم بعيدًا: L<sub>Edd</sub> = 4πGMc/κ ≈ 3.2×10⁴ (M/M☉) L☉، ولهذا تفقد النجوم العملاقة جدًا كتلتها بسرعة.</p>
<p><b>عن النموذج</b>: المسارات محسوبة ببرنامج COSMIC (الإصدار 4.3) في وضع النجم المنفرد SSE، الذي يستخدم صيغ Hurley, Pols & Tout (2000) المعايَرة على نماذج تطور تفصيلية، عند تركيز عناصر ثقيلة Z = 0.014 (قريب من الشمس). الكتلة النهائية للنجوم النيوترونية والثقوب السوداء تعتمد على نموذج الانفجار، وفيها عدم يقين كبير. وكذلك يعطي النموذج للشمس قزمًا أبيض كتلته ≈ 0.46 M☉، بينما تقدّر النماذج الحديثة والأرصاد (علاقة الكتلة الابتدائية–النهائية) نحو 0.53–0.55 M☉؛ والفرق ناتج عن معدل فقد الكتلة المفترض على فرع العمالقة.</p>`,
h2:'⚖️ مصير النجم حسب كتلته الابتدائية',
fateH:['الكتلة الابتدائية','العمر التقريبي','النهاية','البقايا'],
fate:[['أقل من 0.08 M☉','—','لا يشتعل الهيدروجين','قزم بني'],['0.08 – 0.5 M☉','أطول من عمر الكون','قزم أحمر يتحول ببطء إلى قزم أبيض من الهيليوم (لم يحدث بعد لأي نجم)','قزم أبيض هيليومي'],['0.5 – 8 M☉','10¹⁰ – 3×10⁷ سنة','عملاق أحمر ثم فرع العمالقة المقارب ثم سديم كوكبي','قزم أبيض كربوني–أكسجيني (0.5–1.1 M☉)'],['8 – ~20 M☉','3×10⁷ – 10⁷ سنة','عملاق أحمر فائق ثم مستعر أعظم انهياري (Type II)','نجم نيوتروني'],['أكثر من ~20–25 M☉','أقل من 10⁷ سنة','فقدان كتلة شديد (نجم وولف–رايت أحيانًا) ثم انهيار','ثقب أسود (أو نجم نيوتروني)']],
fateNote:'الحدود بين الفئات تقريبية وتعتمد على تركيز العناصر الثقيلة، ودوران النجم، ووجود رفيق ثنائي. وتشير الأرصاد إلى أن بعض النجوم الضخمة قد تنهار إلى ثقب أسود دون انفجار ساطع («مستعر أعظم فاشل»).',
h3:'🔭 صور حقيقية لمراحل حياة النجوم',l3:'صور حقيقية من تلسكوبي هابل وجيمس ويب؛ اضغط على أي صورة لفتحها بدقتها الكاملة.',
imgs:[['https://esahubble.org/images/heic0601a/','🌫️ الولادة: سديم الجبار M42','أقرب منطقة ولادة نجوم كبيرة إلينا، على بُعد نحو ١٥٠٠ سنة ضوئية؛ يظهر فيها أكثر من ٣٠٠٠ نجم. (هابل)'],['https://esahubble.org/images/heic1501a/','🏛️ أعمدة الخلق في سديم النسر M16','أعمدة غاز وغبار باردة تتكوّن داخلها نجوم جديدة، وتتآكل في الوقت نفسه بإشعاع النجوم الشابة. (هابل ٢٠١٥)'],['https://esawebb.org/images/weic2320b/','💍 سديم الحلقة M57: نهاية نجم شبيه بالشمس','سديم كوكبي نموذجي على بُعد نحو ٢٥٠٠ سنة ضوئية: غلاف لفظه نجم يحتضر، ونجمه المركزي في طريقه ليصبح قزمًا أبيض. (ويب ٢٠٢٣)'],['https://esawebb.org/images/weic2326a/','💥 سديم السرطان M1: بقايا مستعر أعظم','بقايا انفجار سُجّل عام ١٠٥٤م على بُعد نحو ٦٥٠٠ سنة ضوئية، وفي قلبه نجم نيوتروني سريع الدوران (نابض). (ويب ٢٠٢٣)']],
hRef:'📚 المراجع ومصادر البيانات',
K:{0:['قزم أحمر على التسلسل الرئيسي','نجم صغير كامل الحمل الحراري: تختلط مادته كلها، فيحرق الهيدروجين ببطء شديد لمدة أطول من عمر الكون الحالي.'],
1:['التسلسل الرئيسي','يندمج الهيدروجين إلى هيليوم في القلب، ويتوازن ضغط الغاز والإشعاع مع الجاذبية (الاتزان الهيدروستاتيكي). هذه أطول مرحلة في حياة النجم، والشمس فيها الآن منذ ٤٫٦ مليار سنة.'],
2:['فجوة هرتزشبرونغ (عبور سريع)','نفد الهيدروجين في القلب؛ ينكمش القلب ويسخن، ويحترق الهيدروجين في قشرة حوله، فيتمدد الغلاف ويبرد بسرعة. المرحلة قصيرة، لذلك نرى نجومًا قليلة جدًا في هذه المنطقة من المخطط.'],
3:['فرع العمالقة الحمر','قلب هيليوم خامل منحلّ تحيط به قشرة هيدروجين مشتعلة. يتضخم النجم إلى عشرات أو مئات أضعاف نصف قطر الشمس، ويزداد سطوعه كثيرًا. الشمس ستبلغ هذه المرحلة بعد نحو ٥ مليارات سنة.'],
4:['احتراق الهيليوم في القلب','اشتعل الهيليوم في القلب (بوميض الهيليوم في النجوم الخفيفة) عبر تفاعل «ألفا الثلاثي» ليكوّن الكربون والأكسجين. يستقر النجم مؤقتًا (الفرع الأفقي أو «الكتلة الحمراء»).'],
5:['فرع العمالقة المقارب المبكر','نفد الهيليوم في القلب؛ قلب كربون–أكسجين محاط بقشرتي هيليوم وهيدروجين. يتضخم النجم مرة أخرى.'],
6:['النبضات الحرارية (فرع العمالقة المقارب)','تشتعل قشرة الهيليوم في ومضات متكررة، وتصعد عناصر جديدة (كالكربون وعناصر العملية البطيئة s) إلى السطح. يفقد النجم غلافه برياح قوية، ثم يظهر سديم كوكبي.'],
7:['نجم هيليوم عارٍ (وولف–رايت)','فقد النجم الضخم غلافه الهيدروجيني كله بالرياح، فبقي قلب هيليوم ساخن جدًا وساطع.'],
8:['نجم هيليوم في طور الانتقال','قلب الهيليوم العاري يستنفد وقوده ويتمدد قليلًا قبل الانهيار.'],
9:['عملاق هيليوم','نجم هيليوم عارٍ متضخم في مراحله الأخيرة.'],
10:['قزم أبيض هيليومي','بقايا نجم صغير جدًا، وهي في الواقع لا تتكوّن من نجم منفرد خلال عمر الكون؛ تُرى في الأنظمة الثنائية.'],
11:['قزم أبيض (كربون–أكسجين)','بقايا القلب بحجم الأرض تقريبًا، تحملها ضغوط الإلكترونات المنحلّة، بلا اندماج نووي. يبرد ويخفت ببطء على مدى مليارات السنين. هذا مصير الشمس.'],
12:['قزم أبيض (أكسجين–نيون)','قزم أبيض ثقيل قريب من حد تشاندراسيخار، من نجم كتلته الابتدائية نحو ٧–٩ M☉.'],
13:['نجم نيوتروني','انهار القلب الحديدي في جزء من الثانية، وانفجر النجم مستعرًا أعظم. بقيت كرة قطرها نحو ٢٠ كم كثافتها مثل نواة الذرة؛ ملعقة صغيرة منها تزن نحو مليار طن.'],
14:['ثقب أسود','انهار القلب إلى ثقب أسود: منطقة لا يفلت منها حتى الضوء. نصف قطر أفقه r_s = 2GM/c² ≈ 3 كم لكل كتلة شمسية.']}
},en:{
title:'The Lives of Stars',sub:'From a cloud to a white dwarf or a black hole',
lead:'A star’s birth mass decides almost everything: its colour, brightness, lifetime and how it dies. Heavier stars burn their fuel far faster, living only millions of years and ending in a huge explosion, while light stars live for billions of years and fade quietly.',
h1:'⭐ The animated Hertzsprung–Russell diagram',
l1:'Pick a birth mass, then press play or drag the slider. The gold dot is the star on the HR diagram (luminosity versus surface temperature); the tracks are computed with published stellar-evolution models, not drawn by hand.',
play:'▶ Play',pause:'⏸ Pause',sun:'☀️ The Sun’s future',
tlNote:'The timeline bar uses true time: the main sequence takes about 90% of a star’s life, while the final stages are very short. The slider moves along the track, not uniformly in time, so short stages stay visible. The dashed segment from the AGB tip to the white dwarf is the planetary-nebula phase, which is fast (~10⁴ yr) and not followed in detail by the model.',
age:'Age',mass:'Current mass',lum:'Luminosity',teff:'Surface temperature',rad:'Radius',myr:'Myr',gyr:'Gyr',
axX:'Surface temperature (K) →',axY:'Luminosity (Sun = 1)',
regions:{ms:'Main sequence',giants:'Giants',sg:'Supergiants',wd:'White dwarfs'},
mathT:'📐 Mathematical details',
m1:`<p>The <b>Stefan–Boltzmann law</b> links the two axes to radius (hence the grey diagonal lines of constant radius):</p><div class="eq">L = 4π R² σ T<sub>eff</sub>⁴   ⇒   log L = 2 log R + 4 log T<sub>eff</sub> + const</div><p>The <b>mass–luminosity relation</b> on the main sequence is roughly L ∝ M<sup>3.5</sup> (1–10 M☉), and the fuel available ∝ M, so</p><div class="eq">t<sub>MS</sub> ≈ 10¹⁰ yr × (M/M☉)<sup>−2.5</sup></div><p>A 10 M☉ star lives only ≈ 3×10⁷ yr. The model used here is more accurate than this scaling: 1 M☉ → 11.0 Gyr, 5 M☉ → 104 Myr, 20 M☉ → 8.8 Myr.</p><p>The <b>Chandrasekhar limit</b>: electron-degeneracy pressure cannot support a white dwarf heavier than ≈ 1.4 M☉, which sets the fate of heavier cores:</p><div class="eq">M<sub>Ch</sub> ≈ 5.83 / μ<sub>e</sub>² M☉ ≈ 1.46 M☉   (μ<sub>e</sub> = 2)</div><p><b>White-dwarf mass–radius relation</b>: R ∝ M<sup>−1/3</sup> — heavier white dwarfs are smaller! (Compare the 1 M☉ and 8 M☉ remnants in the model.)</p><p>The <b>Eddington luminosity</b>, above which radiation pushes the outer layers away: L<sub>Edd</sub> = 4πGMc/κ ≈ 3.2×10⁴ (M/M☉) L☉ — why very massive stars lose mass so fast.</p><p><b>About the model</b>: tracks computed with COSMIC v4.3 in single-star (SSE) mode, using the Hurley, Pols & Tout (2000) formulae calibrated on detailed evolution models, at metallicity Z = 0.014 (near solar). Final neutron-star and black-hole masses depend on the explosion model and are quite uncertain. The model also gives the Sun a 0.46 M☉ white dwarf, whereas modern models and the observed initial–final mass relation suggest ≈ 0.53–0.55 M☉; the difference comes from the assumed mass-loss rate on the giant branch.</p>`,

  const ld=g.createRadialGradient(cx,cy,0,cx,cy,rad);const L=(f)=>`rgb(${Math.min(255,r*f+30*f)|0},${Math.min(255,gg*f+20*f)|0},${Math.min(255,b*f+10*f)|0})`;
  ld.addColorStop(0,L(1.1));ld.addColorStop(.6,L(.95));ld.addColorStop(.85,L(.75));ld.addColorStop(1,L(.45));g.fillStyle=ld;g.fillRect(0,0,300,300);
  if(rad>14){g.globalCompositeOperation='overlay';const sc=rad/60;g.drawImage(granTex(),cx-150*Math.max(1,sc),cy-150*Math.max(1,sc),300*Math.max(1,sc),300*Math.max(1,sc));g.globalCompositeOperation='source-over';}
  // big convective cells for giants
  if(R>20){let sd=3;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;for(let i=0;i<9;i++){const a=rnd()*6.28,d=rnd()*rad*.7;g.fillStyle=`rgba(255,240,200,${.08+.08*rnd()})`;g.beginPath();g.arc(cx+d*Math.cos(a),cy+d*Math.sin(a),rad*(.15+.2*rnd()),0,7);g.fill();}}
  g.restore();
  // Sun reference ring
  const rs=42;g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=5;g.beginPath();g.arc(cx,cy,rs,0,7);g.stroke();g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=2.5;g.setLineDash([7,6]);g.beginPath();g.arc(cx,cy,rs,0,7);g.stroke();g.setLineDash([]);
  $('discCap').textContent=lang==='ar'?'الدائرة المتقطعة = حجم الشمس (مقياس لوغاريتمي)':'Dashed circle = the Sun’s size (log scale)';
}
// real photo for each stage (works online; fallback card offline)
const PH={sun:['img/sdo_hmi_continuum_2023-01-31.jpg','https://sdo.gsfc.nasa.gov/','NASA/SDO (HMI)',['شمسنا الآن: نجم على التسلسل الرئيسي (مرصد SDO، الضوء المرئي)','Our Sun today: a main-sequence star (SDO, visible light)']],
 betel:['https://cdn.eso.org/images/screen/potw1726a.jpg','https://www.eso.org/public/images/potw1726a/','ALMA (ESO/NAOJ/NRAO)/E. O’Gorman/P. Kervella',['منكب الجوزاء كما صوّره ألما: سطح عملاق أحمر حقيقي','Betelgeuse imaged by ALMA: the real surface of a red supergiant']],
 ring:['https://cdn.esawebb.org/archives/images/screen/weic2320b.jpg','https://esawebb.org/images/weic2320b/','ESA/Webb, NASA, CSA, M. Barlow, N. Cox, R. Wesson',['سديم الحلقة M57: نجم شبيه بالشمس يلفظ غلافه، وفي مركزه قزم أبيض','Ring Nebula M57: a Sun-like star shedding its envelope, a white dwarf at its centre']],
 crab:['https://cdn.esawebb.org/archives/images/screen/weic2326a.jpg','https://esawebb.org/images/weic2326a/','NASA, ESA, CSA, STScI, T. Temim',['سديم السرطان M1: بقايا مستعر أعظم وفي قلبه نجم نيوتروني','Crab Nebula M1: a supernova remnant with a neutron star at its heart']],
 bh:['https://cdn.eso.org/images/screen/eso1907a.jpg','https://www.eso.org/public/images/eso1907a/','EHT Collaboration',['أول صورة لثقب أسود: M87* (تلسكوب أفق الحدث 2019)','The first image of a black hole: M87* (Event Horizon Telescope, 2019)']]};
function phFor(k){return k<=1?'sun':k<=5?'betel':k===6||k>=10&&k<=12?'ring':k<=9||k===13?'crab':'bh';}
function phHTML(m,cap){const lt=lang==='ar'?'الصورة تظهر عند فتح الموقع على الإنترنت — اضغط لفتحها من المصدر':'The photo loads when the site is online — tap to open it at the source';
  return `<a class="ph" href="${m[1]}" target="_blank" rel="noopener"><img loading="lazy" src="${m[0]}" alt="" onerror="this.parentNode.classList.add('err')"><span class="fb">🔭<br>${lt}</span></a>`+(cap?`<figcaption>${m[3][lang==='ar'?0:1]}<i>${lang==='ar'?'المصدر':'Credit'}: ${m[2]}</i></figcaption>`:'');}
let lastPh='';function showPhoto(k){const key=phFor(k)+lang;if(key===lastPh)return;lastPh=key;$('stFig').innerHTML=phHTML(PH[phFor(k)],true);}
function showState(){
  const tr=TR[cur],q=tr.p[Math.min(idx,tr.p.length-1)];const K=t('K')[q[1]]||['',''];
  $('stName').textContent=K[0];
  const rows=[[t('age'),fmtAge(q[0])],[t('mass'),N(q[2],2)+' M☉']];
  if(q[1]<13){rows.push([t('lum'),fmtSci(Math.pow(10,q[3]))+' L☉'],[t('teff'),KH.digits(Math.round(Math.pow(10,q[4])).toLocaleString('en'),lang)+' K'],[t('rad'),fmtSci(q[5])+' R☉']);}
  else rows.push([t('rad'),q[1]===14?N(2.95*q[2],1)+(lang==='ar'?' كم (أفق الحدث)':' km (horizon)'):(lang==='ar'?'≈ ١٢ كم':'≈ 12 km')]);
  $('stKV').innerHTML=rows.map(r=>`<b>${r[0]}</b><span>${r[1]}</span>`).join('');
  $('stDesc').textContent=K[1];drawDisc(q);showPhoto(q[1]);
  $('sT').value=Math.round(idx/(tr.p.length-1)*1000);drawHR();drawTL();
}
function fmtSci(v){if(v>=0.01&&v<1e4)return N(v,v<1?3:v<10?2:v<100?1:0);const e=Math.floor(Math.log10(v));return N(v/Math.pow(10,e),2)+'×10'+sup(e);}
function setMass(i){cur=i;idx=0;document.querySelectorAll('#masses .chip').forEach((c,j)=>c.classList.toggle('on',j===i));showState();}
let lastT=0;function loop(now){if(playing&&now-lastT>45){lastT=now;const n=TR[cur].p.length;if(idx<n-1){idx++;showState();}else{playing=false;$('bPlay').textContent=t('play');}}requestAnimationFrame(loop);}
function page(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>{const v=t(e.dataset.i);if(typeof v==='string')e.textContent=v;});
  document.querySelectorAll('[data-h]').forEach(e=>{e.innerHTML=t(e.dataset.h);});
  $('btnLang').textContent=lang==='ar'?'EN':'ع';$('logo').innerHTML=KH.logoSVG(36);
  $('masses').innerHTML=TR.map((tr,i)=>`<button class="chip${i===cur?' on':''}">${KH.digits(String(tr.m),lang)} M☉</button>`).join('');
  document.querySelectorAll('#masses .chip').forEach((c,i)=>c.onclick=()=>setMass(i));
  $('bPlay').textContent=playing?t('pause'):t('play');$('bSun').textContent=t('sun');
  $('fate').innerHTML=`<tr>${t('fateH').map(h=>`<th>${h}</th>`).join('')}</tr>`+t('fate').map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
  const TH=['https://cdn.esahubble.org/archives/images/screen/heic0601a.jpg','https://cdn.esahubble.org/archives/images/screen/heic1501a.jpg','https://cdn.esawebb.org/archives/images/screen/weic2320b.jpg','https://cdn.esawebb.org/archives/images/screen/weic2326a.jpg'];
  $('imgs').innerHTML=t('imgs').map((m,i)=>`<a href="${m[0]}" target="_blank" rel="noopener"><span class="ph"><img loading="lazy" src="${TH[i]}" alt="" onerror="this.parentNode.classList.add('err')"><span class="fb">🔭</span></span><span class="tx"><b>${m[1]} ↗</b>${m[2]}</span></a>`).join('');lastPh='';
  $('cAllT').textContent=lang==='ar'?'إظهار مسارات كل الكتل':'Show tracks for all masses';
  $('refs').innerHTML=['Hurley, J. R., Pols, O. R. & Tout, C. A. (2000) MNRAS 315, 543 — Comprehensive analytic formulae for stellar evolution','Breivik, K. et al. (2020) ApJ 898, 71 — COSMIC: Compact Object Synthesis and Monte Carlo Investigation Code','Kippenhahn, R., Weigert, A. & Weiss, A. (2012) Stellar Structure and Evolution, 2nd ed., Springer','Chandrasekhar, S. (1931) ApJ 74, 81','<b>'+(lang==='ar'?'الصور':'Images')+':</b> NASA, ESA, CSA, STScI — ESA/Hubble & ESA/Webb (CC BY 4.0); ESO/ALMA; EHT Collaboration; NASA/SDO','<b>'+(lang==='ar'?'النجوم الحقيقية في المخطط':'Real stars on the diagram')+':</b> HYG database v4.1 (Hipparcos, Yale, Gliese; CC BY-SA 4.0)'].map(x=>'• '+x).join('<br>');
  $('foot').innerHTML=`${KH.logoSVG(30)}<br>${lang==='ar'?'إعداد: خالد محمد · قسم الفلك وعلوم الفضاء والأرصاد الجوية، كلية العلوم، جامعة القاهرة · عضو AfAS وAUASS':'By Khaled Mohamed · Astronomy, Space Science & Meteorology Dept., Faculty of Science, Cairo University · Member of AfAS and AUASS'}<br><a href="index.html">${lang==='ar'?'الرئيسية':'Home'}</a>`;
  document.title=t('title')+' — '+(lang==='ar'?'خالد محمد':'Khaled Mohamed');showState();
}
$('bPlay').onclick=()=>{if(idx>=TR[cur].p.length-1)idx=0;playing=!playing;$('bPlay').textContent=playing?t('pause'):t('play');};
$('bSun').onclick=()=>{setMass(TR.findIndex(x=>x.m===1));playing=true;$('bPlay').textContent=t('pause');};
$('sT').oninput=()=>{const n=TR[cur].p.length;idx=Math.round(+$('sT').value/1000*(n-1));playing=false;$('bPlay').textContent=t('play');showState();};
$('btnLang').onclick=()=>{lang=lang==='ar'?'en':'ar';KH.setLang(lang);page();};
addEventListener('resize',showState);$('cAll').onchange=()=>{bgCache=null;drawHR();};
page();requestAnimationFrame(loop);
window.__stars={setMass,set idx(v){idx=v;showState();},get tr(){return TR[cur];}};
})();
</script>
