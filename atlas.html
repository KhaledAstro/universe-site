<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<title>أطلس السماء | Sky Atlas — خالد محمد</title>
<link rel="stylesheet" href="css/app.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0f1e;touch-action:none}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#sky.dragging{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#0a0f1ef5 55%,#0a0f1e00);pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand h1{font-size:17px;margin:0;color:var(--gold-l);font-weight:700;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{position:fixed;top:calc(58px + env(safe-area-inset-top));left:0;right:0;display:flex;gap:7px;padding:0 12px;overflow-x:auto;z-index:5;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.timebar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#0a0f1e00,#0a0f1ef2 35%);}
.trow{display:flex;align-items:center;gap:6px;justify-content:center}
.tdisp{text-align:center;min-width:132px;cursor:pointer}
.tdisp .d{font-size:12px;color:var(--muted)}
.tdisp .t{font-size:18px;color:#fff;font-variant-numeric:tabular-nums;font-weight:600}
.tdisp .live{font-size:10px;color:#6ee7a8}
.tdisp .live.off{color:#f6b26b}
#tSlider{width:100%;margin:6px 0 0;accent-color:var(--gold)}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:15px;display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn.on{background:var(--gold);color:#0a0f1e;border-color:var(--gold)}
#info{position:fixed;z-index:7;left:10px;right:10px;bottom:calc(112px + env(safe-area-inset-bottom));max-width:420px;margin:auto;max-height:52vh;overflow:auto}
#info h2{margin:0 0 2px;font-size:20px;color:var(--gold-l)}
#info .alt{color:var(--muted);font-size:13px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font-variant-numeric:tabular-nums}
.note{margin-top:8px;font-size:12.5px;color:#f6b26b}
.row-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.x{position:absolute;top:8px;inset-inline-end:8px}
#drawer{position:fixed;z-index:8;top:0;bottom:0;inset-inline-end:0;width:min(380px,92vw);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;border-radius:0;padding:0;padding-top:env(safe-area-inset-top)}
[dir=rtl] #drawer{transform:translateX(-105%)}
#drawer.open{transform:none}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;min-width:64px;padding:8px 6px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--glass2);color:#fff;border-color:var(--line)}
.pane{display:none;padding:12px 14px 30px;overflow:auto;flex:1}
.pane.on{display:block}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #ffffff0d;font-size:14px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--gold)}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-inline-end:8px;vertical-align:middle}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0e1630;color:#fff;font:inherit;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid #ffffff0d;cursor:pointer;font-size:14px}
.list .it:hover{background:#ffffff08}
.list .it small{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:8px}
#guide{position:fixed;z-index:7;top:calc(100px + env(safe-area-inset-top));left:10px;right:10px;max-width:440px;margin:auto}
#guide ol{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px;line-height:1.7}
#toast{position:fixed;z-index:9;left:50%;top:calc(104px + env(safe-area-inset-top));transform:translateX(-50%);padding:9px 14px;border-radius:12px;background:#111a36ee;border:1px solid var(--line);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.scrim{position:fixed;inset:0;background:#0006;z-index:7;display:none}
.scrim.on{display:block}
.about p{font-size:13.5px;line-height:1.7;color:#d9e0f2}
.about .who{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.legend{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<header class="top">
  <a class="brand" href="index.html" id="homeLink">
    <span id="logo"></span>
    <div style="min-width:0"><h1 data-i="title"></h1><div class="sub" id="placeLbl"></div></div>
  </a>
  <button class="ibtn" id="btnLang" title="Language">EN</button>
  <button class="ibtn" id="btnMode" title="2D / 3D">3D</button>
  <button class="ibtn" id="btnMenu" title="Menu">☰</button>
</header>

<div class="chips">
  <button class="chip" id="cHere" data-i="cHere"></button>
  <button class="chip" id="cDome" data-i="cDome"></button>
  <button class="chip" id="cGyro" data-i="cGyro"></button>
  <button class="chip" id="cPolaris" data-i="cPolaris"></button>
  <button class="chip" id="cNow" data-i="cNow"></button>
  <button class="chip" id="cSearch" data-i="cSearch"></button>
</div>

<div id="toast"></div>
<div id="guide" class="panel" hidden></div>
<div id="info" class="panel" hidden></div>
<div class="scrim" id="scrim"></div>

<aside id="drawer" class="panel">
  <div class="tabs">
    <button class="tab on" data-p="pLayers" data-i="tLayers"></button>
    <button class="tab" data-p="pPlace" data-i="tPlace"></button>
    <button class="tab" data-p="pNow" data-i="tNow"></button>
    <button class="tab" data-p="pSearch" data-i="tSearch"></button>
    <button class="tab" data-p="pAbout" data-i="tAbout"></button>
  </div>
  <div class="pane on" id="pLayers"></div>
  <div class="pane" id="pPlace">
    <label class="f" data-i="city"></label>
    <select class="inp" id="citySel"></select>
    <button class="btn" id="btnGeo" style="margin-top:10px;width:100%" data-i="useGeo"></button>
    <div class="two">
      <div><label class="f" data-i="lat"></label><input class="inp" id="inLat" type="number" step="0.0001"></div>
      <div><label class="f" data-i="lon"></label><input class="inp" id="inLon" type="number" step="0.0001"></div>
    </div>
    <button class="btn ghost" id="btnApplyLL" style="margin-top:8px;width:100%" data-i="applyLL"></button>
    <hr style="border-color:var(--line);margin:16px 0">
    <label class="f" data-i="dateTime"></label>
    <input class="inp" id="inDT" type="datetime-local" step="60">
    <div class="two" style="margin-top:8px">
      <button class="btn" id="btnApplyDT" data-i="applyDT"></button>
      <button class="btn ghost" id="btnNowDT" data-i="now"></button>
    </div>
    <div class="legend" id="tzNote"></div>
  </div>
  <div class="pane" id="pNow"><div class="list" id="nowList"></div></div>
  <div class="pane" id="pSearch">
    <input class="inp" id="q" autocomplete="off">
    <div class="list" id="qList" style="margin-top:8px"></div>
  </div>
  <div class="pane about" id="pAbout"></div>
</aside>

<footer class="timebar">
  <div class="trow">
    <button class="ibtn" id="tBack" title="Reverse">⏪</button>
    <button class="ibtn" id="tPlay" title="Play/Pause">▶</button>
    <button class="ibtn" id="tFwd" title="Forward">⏩</button>
    <div class="tdisp" id="tDisp"><div class="d" id="tDate"></div><div class="t" id="tTime"></div><div class="live" id="tLive"></div></div>
    <select class="inp" id="tSpeed" style="width:auto;padding:7px 6px;font-size:12px"></select>
    <button class="ibtn" id="tNowB" title="Now">⦿</button>
  </div>
  <input type="range" id="tSlider" min="-720" max="720" value="0" step="1">
</footer>

<script src="js/skydata.js"></script>
<script src="js/astro.js"></script>
<script src="js/common.js"></script>
<script src="js/astronomy.min.js"></script>
<script src="js/body3d.js"></script>
<script src="js/atlas.js"></script>
</body>
</html>
