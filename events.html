<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("khSky.theme"))||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>تقويم الظواهر الفلكية | Sky Events</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/page.css">
</head>
<body>
<header class="pg-top">
  <a class="brand" href="index.html"><span id="logo"></span><div><h1 data-i="title"></h1><div class="sub" id="placeLbl"></div></div></a>
  <button class="ibtn" id="btnLang">EN</button>
</header>
<main class="wrap">
  <section class="panel loc-bar">
    <select class="inp" id="citySel"></select>
    <button class="btn sm" id="btnGeo" data-i="useGeo"></button>
    <select class="inp" id="rangeSel"></select>
  </section>

  <section id="today" class="grid2"></section>

  <h2 class="sec" data-i="hHijri"></h2>
  <p class="lead" data-i="hijriLead"></p>
  <div id="hijri" class="panel tbl-wrap"><div class="spin" data-i="computing"></div></div>

  <h2 class="sec" data-i="hAll"></h2>
  <div class="chips-row" id="filters"></div>
  <div id="list"><div class="spin" data-i="computing"></div></div>

  <h2 class="sec" data-i="hISS"></h2>
  <div id="iss" class="panel"></div>
</main>
<div id="modal" class="modal" hidden><div class="panel modal-box" id="modalBox"></div></div>
<footer class="pg-foot" id="foot"></footer>
<script src="js/skydata.js"></script>
<script src="js/astro.js"></script>
<script src="js/common.js"></script>
<script src="js/astronomy.min.js"></script>
<script src="js/satellite.min.js"></script>
<script src="js/events-core.js"></script>
<script src="js/events.js"></script>
</body>
</html>
