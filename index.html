<style>
#bg{position:fixed;inset:0;z-index:-1}
[data-theme=light] #bg{display:none}
.hero{text-align:center;padding:34px 16px 6px}
.hero .lg{display:inline-block;filter:drop-shadow(0 8px 30px #e8b94a55)}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:900;margin:14px 0 6px;background:linear-gradient(90deg,#f6e3a1,#e8b94a 50%,#ff9a5a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}

.hero p{color:var(--muted);max-width:680px;margin:6px auto;line-height:1.85;font-size:15.5px}
.hero .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
.locline{margin-top:12px;font-size:13px;color:var(--muted)}
.locline b{color:var(--gold-l)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px}
.cardx{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;padding:18px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);transition:transform .18s,border-color .18s,box-shadow .18s;min-height:160px}

.cardx .top{display:flex;align-items:center;justify-content:space-between}
.cardx .em{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.cardx h3{margin:6px 0 2px;font-size:18px;font-weight:800;color:var(--txt)}
.cardx p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.75;flex:1}
.cardx .go{color:var(--gold-l);font-weight:700;font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>

<canvas id="bg"></canvas>
<header class="pg-top">

  <div class="filters" id="flt"></div>
  <div class="count" id="cnt"></div>
  <div class="cards" id="cards"></div>
</main>
<footer class="pg-foot" id="foot"></footer>

function render(){
 const s=S[lang]; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; document.body.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>{const v=s[e.dataset.i];if(typeof v==='string')e.textContent=v;});
 $('btnLang').textContent=lang==='ar'?'EN':'ع'; $('logo').innerHTML=KH.logoSVG(96); $('logoS').innerHTML=KH.logoSVG(34);
 const l=KH.getLoc(); $('locline').innerHTML=`${s.loc}: <b>${(KH.CITIES.find(c=>c.id===l.id)||{})[lang]||(l.lat.toFixed(2)+', '+l.lon.toFixed(2))}</b>`;
 $('stats').innerHTML=s.stats.map(x=>`<div class="stat"><b>${KH.digits(Number(x[0]).toLocaleString('en'),lang)}</b><span>${x[1]}</span></div>`).join('');

 drawCards();

function drawCards(){
 const s=S[lang],q=KH.normAr($('q').value);
 const list=s.cards.filter(c=>(fcat==='all'||CAT[c[0]]===fcat)&&(!q||KH.normAr(c[2]+' '+c[3]).includes(q)));
 $('cnt').textContent=s.show(KH.digits(list.length,lang),KH.digits(s.cards.length,lang));
 $('cards').innerHTML=list.length?list.map(c=>`<a class="cardx" href="${c[0]}"><div class="top"><div class="em">${c[1]}</div><span class="tag ${c[0]==='eclipses.html'?'gold':'ok'}">${c[0]==='eclipses.html'?s.newb:s.ready}</span></div><h3>${c[2]}</h3><p>${c[3]}</p><span class="go">${s.go}</span></a>`).join(''):`<div class="empty">${s.none}</div>`;
}
$('q').oninput=drawCards;
$('btnLang').onclick=()=>{lang=lang==='ar'?'en':'ar';KH.setLang(lang);render();};
render();
// starfield
const c=$('bg'),g=c.getContext('2d');let W,H,st=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:Math.round(W*H/2500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6}));}
addEventListener('resize',rs);rs();
(function f(t){g.fillStyle='#07090f';g.fillRect(0,0,W,H);const gr=g.createRadialGradient(W*.75,-H*.12,0,W*.75,-H*.12,H*1.1);gr.addColorStop(0,'#2a2210');gr.addColorStop(1,'#07090f00');g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(const s of st){const a=.45+.55*Math.sin(t/900+s.p);g.fillStyle=`rgba(230,236,255,${a})`;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();}requestAnimationFrame(f);})(0);
