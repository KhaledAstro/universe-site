const TH=[
 {id:'giant',acc:35,ar:['💥 الاصطدام العملاق الكلاسيكي','Hartmann & Davis (1975)، Cameron & Ward (1976)، Canup & Asphaug (2001)','قبل نحو ٤٫٥١ مليار سنة اصطدم كوكب بحجم المريخ تقريبًا يُسمّى «ثيا» (≈١٠–١٥٪ من كتلة الأرض) بالأرض الأولى بزاوية مائلة نحو ٤٥°. غاصت نواة ثيا الحديدية واندمجت في نواة الأرض، وقُذفت الصخور المنصهرة والمتبخرة من الوشاحين إلى قرص حول الأرض، ثم تجمّعت خلال أشهر إلى سنين فكوّنت القمر.',

  ['The "isotope crisis": simulations make the Moon 60–80% Theia, yet its O, Ti and Cr isotopes nearly match Earth\'s','Requires Theia to resemble Earth: an awkward coincidence','Does not fully explain the 5° inclination of the lunar orbit']]},
 {id:'synestia',acc:25,ar:['🌀 الاصطدام عالي الطاقة والسينستيا','Ćuk & Stewart (2012)، Canup (2012)، Lock & Stewart (2017، 2018)','اصطدام أعنف بكثير بأرضٍ سريعة الدوران (يومها ساعتان أو ثلاث) يبخّر جزءًا كبيرًا من الأرض وثيا ويكوّن «سينستيا»: كتلة ضخمة دوّارة من الصخر المتبخر على هيئة كعكة، أكبر من الأرض بأضعاف. تختلط المادة جيدًا في الطور البخاري، فيتكثّف القمر داخل هذه السحابة ويخرج بنظائر الأرض نفسها. ثم يزيل الرنين المداري مع الشمس (رنين الإيفيكشن) الزخم الزائد.',

  en:['🌀 High-energy impact & synestia','Ćuk & Stewart (2012), Canup (2012), Lock & Stewart (2017, 2018)','A far more violent impact onto a fast-spinning Earth (2–3 h day) vaporises much of both bodies into a "synestia", a huge spinning doughnut of rock vapour. Material mixes thoroughly in the vapour, so the Moon condenses inside it with Earth-like isotopes; an orbital resonance with the Sun (evection) later removes the excess angular momentum.',
  ['Solves the isotope crisis by mixing in the vapour phase','Explains depleted and isotopically heavy K and Zn (volatile loss from vapour)','Keeps the giant-impact successes (small core, magma ocean)'],

 {id:'immediate',acc:10,sim:false,ar:['⚡ القمر الفوري (في ساعات)','Kegerreis وآخرون (٢٠٢٢)، NASA Ames وجامعة دورهام','بيّنت محاكاة عالية الدقة جدًا (حتى ١٠٨ ملايين جسيم) أن الاصطدام قد يقذف كتلة كبيرة إلى المدار مباشرة، فيتكوّن القمر في ساعات بدلًا من أشهر، ويحوي القمر الناتج مادة أرضية أكثر في طبقاته الخارجية.',

  en:['⚡ Immediate Moon (in hours)','Kegerreis et al. (2022), NASA Ames & Durham University','Very-high-resolution simulations (up to 10⁸ particles) showed the impact can throw a large clump straight into orbit, forming the Moon within hours instead of months. Its outer layers carry more Earth material.',

 {id:'multi',acc:15,ar:['☄️ الاصطدامات المتعددة','Rufu، Aharonson & Perets (٢٠١٧)','بدلًا من اصطدام واحد ضخم، نحو ٢٠ اصطدامًا أصغر على مدى ملايين السنين. يقذف كل اصطدام مادة معظمها من الأرض نفسها فيتكوّن «قُمير» صغير، وتهاجر القُميرات إلى الخارج بقوى المد وتندمج معًا حتى يتكوّن القمر.',

  en:['☄️ Multiple impacts','Rufu, Aharonson & Perets (2017)','Instead of one giant collision, ~20 smaller impacts over millions of years. Each ejects mostly Earth material into a small moonlet; moonlets migrate outward by tides and merge into the Moon.',
